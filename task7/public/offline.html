<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Offline — TechVault</title>
    <!--
      Dedicated offline page. It is pre-cached by the Service Worker and returned for
      any page you have not visited before while there is no connection.
      Everything is inline because it may be shown under any URL of the app.
    -->
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 2rem 1.25rem;
        border-radius: 18px;
        background: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.16);
      }
      .icon { font-size: 3rem; }
      h1 { margin: 0.75rem 0 0.5rem; font-size: 1.5rem; }
      p { color: #cbd5e1; line-height: 1.6; }
      .status { margin-top: 1rem; color: #f59e0b; font-weight: 600; }
      button {
        margin-top: 1.25rem;
        min-height: 44px;
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: #0f172a;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You are offline</h1>
      <p>
        This page has not been saved for offline use yet. Pages and products you visited
        before are still available. Check your connection and try again.
      </p>
      <p class="status" id="status" role="status">● No internet connection</p>
      <button type="button" id="retry">Retry Connection</button>
    </main>

    <script>
      // Reloading goes through the Service Worker again: if the network is back,
      // the real page loads; if not, this page is shown again.
      const retry = () => {
        document.getElementById('status').textContent = '● Checking connection...';
        window.location.reload();
      };
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
